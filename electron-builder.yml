appId: dev.vandelay.agents
productName: Vandelay Agents
directories:
  output: release
# No spaces: GitHub renames release files that have them.
artifactName: vandelay-agents-${version}-${os}-${arch}.${ext}
files:
  - out/**
  - package.json
# node-pty ships prebuilt N-API binaries, and it starts helper scripts and executables from its own
# folder, so keep it outside the asar archive and don't rebuild it.
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: false
# Where installed copies look for updates (electron-updater reads latest*.yml from the release).
publish:
  provider: github
  owner: aryanthakur0505
  repo: vandelay-agents
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  # Apple silicon and Intel Macs each get their own dmg.
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
linux:
  # AppImage runs anywhere; the .deb installs properly on Debian and Ubuntu.
  target: [AppImage, deb]
  category: Development
  maintainer: Vandelay Agents contributors <227968872+aryanthakur0505@users.noreply.github.com>
deb:
  # electron-builder's defaults, plus ALSA: Electron won't start without libasound, and Ubuntu 24.04
  # renamed it libasound2t64, so a minimal install didn't pull it in.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
