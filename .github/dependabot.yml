# Weekly pull requests for outdated npm packages and GitHub Actions. Minor and patch npm updates come
# grouped in one PR so they're easy to review; majors get their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
